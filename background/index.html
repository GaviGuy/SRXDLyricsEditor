<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A web-based application for creating and previewing lyrics for Spin Rhythm XD">
    <title>SRXD Lyrics Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">

    <link rel="stylesheet" type="text/css" href="../main.css">
    <script defer type="text/javascript" src="../main.js"></script>
    <script defer type="text/javascript" src="background.js"></script>

</head>
<body>
    <div class="main">
        <div class="column-left">
            <div>
                Normal lyric format applies: spaces between each syllable,<br>
                hyphens to connect syllables, \n to denote a newline<br>
                <br>
                <textarea onchange="readParameters(-1)" id="input" rows=2 cols=80
                        title="Input field"></textarea><br>
            </div>
            <div class="util-container">
                <button onclick="generateLyricString()"
                        title="Copy output string to clipboard, for use in SRXD">Copy to Clipboard</button>
            </div>
            <div class="guide">
                waw
            </div>
        </div>
        <div class="column-right">
            <div id="config">
                <div>
                    <label class="config-label" for="config-text-size">Text size</label>
                    <input onchange="readParameters(0)" type="number" value="10"
                            title="Text size"
                            class="config" step=1 min=0 id="config-text-size"></input>
                    <button onClick="revertConfig(0)">default</button>
                </div>
                <div>
                    <label class="config-label" for="config-vertical-spacing">Vertical spacing</label>
                    <input onchange="readParameters(1)" type="number" value="12"
                            title="Vertical space between each line"
                            class="config" step=1 id="config-vertical-spacing"></input>
                    <button onClick="revertConfig(1)">default</button>
                </div>
                <div>
                    <label class="config-label" for="config-bg-lightness">BG lightness</label>
                    <input onchange="readParameters(2)" type="number" value="0"
                            title="Brightness of the background, from yellow (255) to black (0)"
                            class="config" step=1 id="config-bg-lightness"></input>
                    <button onClick="revertConfig(2)">default</button>
                </div>
                <div>
                    <label class="config-label" for="config-bg-opacity">BG opacity</label>
                    <input onchange="readParameters(3)" type="number" value="255"
                            title="Opacity of the background, from solid (255) to transparent (0)"
                            class="config" step=1 id="config-bg-opacity"></input>
                    <button onClick="revertConfig(3)">default</button>
                </div>
                <div>
                    <label class="config-label" for="config-extra-squares">Extra Opaque Background</label>
                    <input onchange="readParameters(4)" type="checkbox" checked=false title="When checked, 3 squares are used instead of 1. Use when chaining multiple background phrases together"
                            id="config-extra-squares"></input>
                </div>
            </div>
            
            <div>
                <br>
                Preview:
                <i><small><br>Not always accurate. Please test in-game!</small></i>
                <div class="widther" id="widther"></div>
                <div class="preview-container">
                    <div id="preview"></div>
                </div>
            </div>
        </div>
    </div>
    <div>
        <button onclick="document.location='..'">Back to index</button>
    </div>
</body>
</html>
